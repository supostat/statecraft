AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "example/**/*"
    - "benchmark/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "statecraft.gemspec"

Metrics/MethodLength:
  Max: 30
  Exclude:
    - "spec/**/*"

Metrics/ClassLength:
  Max: 250

Metrics/AbcSize:
  Max: 30
  Exclude:
    - "spec/**/*"

# The mount macro's surface is a deliberate set of keyword options fixed by the
# design; keywords document themselves.
Metrics/ParameterLists:
  Max: 8

# Type dispatchers (metadata round-trip) are case tables by nature.
Metrics/CyclomaticComplexity:
  Max: 10

# Class-level state of the DSL mixin lives on the USER's machine class, so the
# ivar names carry a statecraft_ prefix to stay out of the host's namespace.
Naming/MemoizedInstanceVariableName:
  Enabled: false

# Descriptive rescue names over the cryptic `e` — readability beats brevity.
Naming/RescuedExceptionsVariableName:
  Enabled: false
