name: Release

on:
  push:
    tags: ["v*"]

# Publishes via OIDC trusted publishing: rubygems.org is configured to trust
# this repository's release.yml running in the "release" environment, so no
# API key exists anywhere.
jobs:
  push:
    name: rubygems.org
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec
      - uses: rubygems/release-gem@v1
