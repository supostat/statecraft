name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-build:
    name: site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash site/build.sh

  test-sqlite:
    name: sqlite · ruby ${{ matrix.ruby }} · ar ${{ matrix.ar }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
        ar: ["7.2", "8.0", "8.1"]
        # Ruby 4.0 conservatively pairs with the newest ActiveRecord only:
        # the gemspec's >= 3.3 allows installing on 4.0, so CI must cover it,
        # but older AR lines never promised the new major.
        include:
          - ruby: "4.0"
            ar: "8.1"
    env:
      AR_VERSION: ${{ matrix.ar }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: ar-${{ matrix.ar }}
      - run: bundle exec rspec

  test-postgres:
    name: postgres · ruby ${{ matrix.ruby }} · ar ${{ matrix.ar }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
        ar: ["7.2", "8.0", "8.1"]
        include:
          - ruby: "4.0"
            ar: "8.1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: statecraft
          POSTGRES_PASSWORD: statecraft
          POSTGRES_DB: statecraft_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U statecraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AR_VERSION: ${{ matrix.ar }}
      DATABASE_URL: postgres://statecraft:statecraft@localhost:5432/statecraft_test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: ar-${{ matrix.ar }}
      - run: bundle exec rspec
